<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Tournament Carousel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .upcoming-section {
      text-align: center;
    }

    .upcoming-section h2 {
      font-size: 2rem;
      color: #30aba9;
      margin-bottom: 30px;
    }

    .carousel-container {
      position: relative;
      width: 400px;
      height: 400px;
      perspective: 1000px;
      margin: 0 auto;
    }

    .carousel {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 1s ease;
    }

    .tournament-card {
      position: absolute;
      width: 260px;
      height: 180px;
      background-color: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 0 15px #03fffc7d;
      padding: 20px;
      color: white;
      text-align: center;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.3s;
    }

    .tournament-card h3 {
      color: #30aba9;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .tournament-card p {
      font-size: 0.95rem;
      color: #ccc;
      margin-bottom: 8px;
    }

    .join-btn {
      background-color: #30aba9;
      color: #0f0f0f;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .join-btn:hover {
      background-color: #03fffc;
    }
  </style>
</head>
<body>

<section class="upcoming-section">
  <h2>Upcoming Tournaments</h2>
  <div class="carousel-container">
    <div class="carousel" id="carousel">
      <div class="tournament-card" style="transform: rotateY(0deg) translateZ(350px);" data-angle="0">
        <h3>BGMI Squad Showdown</h3>
        <p>Date: 5 May 2025</p>
        <p>Entry Fee: ₹50</p>
        <p>Prize Pool: ₹2000</p>
        <a href="register.html" class="join-btn">Join Now</a>
      </div>
      <div class="tournament-card" style="transform: rotateY(120deg) translateZ(350px);" data-angle="120">
        <h3>Solo Sniper Elite</h3>
        <p>Date: 8 May 2025</p>
        <p>Entry Fee: Free</p>
        <p>Prize Pool: ₹500</p>
        <a href="register.html" class="join-btn">Join Now</a>
      </div>
      <div class="tournament-card" style="transform: rotateY(240deg) translateZ(350px);" data-angle="240">
        <h3>Ultimate Rush Hour</h3>
        <p>Date: 10 May 2025</p>
        <p>Entry Fee: ₹100</p>
        <p>Prize Pool: ₹5000</p>
        <a href="register.html" class="join-btn">Join Now</a>
      </div>
    </div>
  </div>
</section>

<script>
  const carousel = document.getElementById('carousel');
  const cards = document.querySelectorAll('.tournament-card');
  let isRotating = true;
  let currentAngle = 0;
  let lastClickedCard = null;
  let animationId = null;

  function startRotation(fromAngle) {
    let angle = fromAngle;
    cancelAnimationFrame(animationId);

    function rotateStep() {
      angle += 0.25; // Increased speed
      carousel.style.transform = `rotateY(${angle}deg)`;
      currentAngle = angle;
      animationId = requestAnimationFrame(rotateStep);
    }

    rotateStep();
  }

  function stopRotation() {
    cancelAnimationFrame(animationId);
  }

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const cardAngle = parseInt(card.dataset.angle);
      const rotateTo = -cardAngle;

      if (!isRotating && lastClickedCard === card) {
        startRotation(currentAngle);
        isRotating = true;
        lastClickedCard = null;
      } else {
        stopRotation();
        carousel.style.transform = `rotateY(${rotateTo}deg)`;
        currentAngle = rotateTo;
        isRotating = false;
        lastClickedCard = card;
      }
    });
  });

  // ⏬ Resume rotation on scroll
  window.addEventListener('scroll', () => {
    if (!isRotating) {
      startRotation(currentAngle);
      isRotating = true;
      lastClickedCard = null;
    }
  });

  // ▶ Start on page load
  startRotation(0);
</script>

</body>
</html>
